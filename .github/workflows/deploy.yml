name: Deploy to Cloudways

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${{ secrets.SERVER_IP }}" ]; then
            ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          else
            echo "Error: SERVER_IP secret is empty!"
            exit 1
          fi

      - name: Deploy code to Cloudways
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /home/master/applications/kjbhnqcgbp/public_html/toolkit-test

            # Load NVM + Node environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            echo "Pulling latest code..."
            if [ -d ".git" ]; then
              git pull origin main
            else
              echo "Not a git repo, skipping git pull"
            fi

            echo "Installing dependencies..."
            npm install --production

            echo "Restarting PM2 app..."
            pm2 restart all || pm2 start ecosystem.config.js

            echo "Deployment completed!"
          EOF
